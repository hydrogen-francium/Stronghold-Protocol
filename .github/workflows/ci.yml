name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The unit & integration step alone took 19.7 min (ubuntu) and 22.4 min (windows) on Node 22 in run 38777566530,
    # and more tests ran to the end once the Windows failures were fixed: 25 minutes left no margin.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 and 24 = the maintained LTS lines (24 is what `winget install OpenJS.NodeJS.LTS` installs today)
        node: [22, 24]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      # package.json "test": node --test over the test files. A bare `node --test` would also run every helper and
      # fixture under test/ (Node's default patterns take any .js there for a test file).
      - name: Unit & integration tests
        run: npm run test

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        run: node tools/ci.mjs --only smoke

  # Separate from the test matrix so lint / types / import boundaries run once, not four times.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Lint (warnings allowed)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

  compose:
    name: 容器配置与构建（不宣称真实素材冷启动）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SP_DOMAIN: game.example.invalid
      ACME_EMAIL: operator@example.invalid
      SP_ENTRY_TOKEN_PATH: ./deploy/secrets/entry-token
      SP_SESSION_SECRET_PATH: ./deploy/secrets/session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: 安装锁定依赖
        run: npm ci --no-audit --no-fund
      - name: 创建仅供配置检查的独立强密钥
        run: node tools/deploy/control.mjs secrets "$PWD/deploy/secrets"
      - name: 检查正式与本机配置
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - name: 构建固定镜像（不下载游戏素材）
        run: docker compose build
      - name: 校验反代配置（不申请公网证书）
        run: docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
